[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mykonos-meme-scout"
version = "1.0.1"
description = "Mykonos one-command run-ready real-time temporal paper-shadow system"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]

[project.scripts]
mykonos-scout = "mykonos_meme_scout.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mykonos_meme_scout*"]
